<div class="order-box" *ngIf="order">
  <h2>Order #{{ order.id }}</h2>
  <p>Customer: {{ order.customerName }}</p>
  <p [ngClass]="getStatusClass()">Status: {{ order.status }}</p>

  <table>
    <tr>
      <th>Product</th>
      <th>Qty</th>
      <th>Unit price</th>
    </tr>
    <tr *ngFor="let item of order.items">
      <td>{{ item.productName }}</td>
      <td>{{ item.quantity }}</td>
      <td>{{ item.unitPrice }}</td>
    </tr>
  </table>

  <p>Subtotal: {{ subtotal }}</p>
  <p>Tax: {{ tax }}</p>
  <p>Total: {{ total }}</p>
</div>
